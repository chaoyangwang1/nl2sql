# ============================================================
# Data Agent 应用配置（示例文件）
# 使用方式：复制本文件为 app_config.yaml 并填写实际配置
#   cp conf/app_config.example.yaml conf/app_config.yaml
# ============================================================

logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

# 元数据库（存储表/列/指标等元数据配置）
db_meta:
  host: 127.0.0.1
  port: 3306
  user: root
  password: <your_password>
  database: nl2sql

# 数据仓库（业务数据查询目标库）
db_dw:
  host: 127.0.0.1
  port: 3306
  user: root
  password: <your_password>
  database: nl2sql

# 向量数据库（列向量、指标向量检索）
qdrant:
  host: 127.0.0.1
  port: 6333
  embedding_size: 1024

# 本地 Embedding 服务（用于向量化）
embedding:
  host: 127.0.0.1
  port: 8088
  model: BAAI/bge-large-zh-v1.5

# Elasticsearch（值召回）
es:
  host: 127.0.0.1
  port: 9200
  index_name: data_agent

# LLM 配置（用于 NL2SQL 生成）
llm:
  model_name: deepseek-v4-pro
  api_key: <your_api_key>
  base_url: https://api.deepseek.com
